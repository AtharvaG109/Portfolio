<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LLM RedTeam Framework diagram</title>
  <desc id="desc">Diagram showing attack packs, adaptive execution, detectors, and report outputs for an LLM AppSec red-team framework.</desc>
  <rect width="1200" height="720" rx="36" fill="#090D12"/>
  <rect x="54" y="48" width="1092" height="624" rx="28" fill="#101722" stroke="#2C3B4D"/>
