  <text x="92" y="140" fill="#AAB7C6" font-family="Arial, sans-serif" font-size="18">authorized synthetic attack suites, adaptive probes, replayable evidence, and CI-ready reports</text>

  <rect x="92" y="186" width="228" height="130" rx="20" fill="#142033" stroke="#5CB6FF"/>
  <text x="120" y="226" fill="#8ED0FF" font-family="Arial, sans-serif" font-size="15" font-weight="700">ATTACK PACKS</text>
  <text x="120" y="260" fill="#F7FAFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">YAML suites</text>
  <text x="120" y="290" fill="#B9C5D3" font-family="Arial, sans-serif" font-size="16">tactics · canaries · policy</text>

  <rect x="366" y="186" width="228" height="130" rx="20" fill="#142033" stroke="#63D6A2"/>
  <text x="394" y="226" fill="#8FF0BE" font-family="Arial, sans-serif" font-size="15" font-weight="700">RUNNER</text>
  <text x="394" y="260" fill="#F7FAFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Adaptive turns</text>
  <text x="394" y="290" fill="#B9C5D3" font-family="Arial, sans-serif" font-size="16">mutate · retry · confirm</text>

  <rect x="640" y="186" width="228" height="130" rx="20" fill="#142033" stroke="#F0C56B"/>
  <text x="668" y="226" fill="#F8D887" font-family="Arial, sans-serif" font-size="15" font-weight="700">DETECTORS</text>
  <text x="668" y="260" fill="#F7FAFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">Evidence checks</text>
  <text x="668" y="290" fill="#B9C5D3" font-family="Arial, sans-serif" font-size="16">canary · leakage · refusal</text>

  <rect x="914" y="186" width="194" height="130" rx="20" fill="#142033" stroke="#DDA7FF"/>
  <text x="942" y="226" fill="#E5C0FF" font-family="Arial, sans-serif" font-size="15" font-weight="700">REPORTS</text>
  <text x="942" y="260" fill="#F7FAFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">CI outputs</text>
  <text x="942" y="290" fill="#B9C5D3" font-family="Arial, sans-serif" font-size="16">MD · JSON · SARIF · JUnit</text>

  <path d="M320 250H366" stroke="#5CB6FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M594 250H640" stroke="#63D6A2" stroke-width="4" stroke-linecap="round"/>
  <path d="M868 250H914" stroke="#F0C56B" stroke-width="4" stroke-linecap="round"/>

  <rect x="92" y="372" width="1016" height="208" rx="24" fill="#0C121A" stroke="#273445"/>
  <text x="124" y="420" fill="#F7FAFF" font-family="Arial, sans-serif" font-size="24" font-weight="700">release evidence</text>

  <rect x="124" y="452" width="218" height="80" rx="16" fill="#131E2D" stroke="#263B52"/>
